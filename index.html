<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自己紹介</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f7f8fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    main {
      width: min(100%, 720px);
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 16px 40px rgba(31, 41, 55, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.1;
    }

    h2 {
      margin: 32px 0 12px;
      font-size: 1.25rem;
    }

    p {
      margin: 0 0 16px;
      line-height: 1.8;
    }

    ul {
      margin: 0;
      padding-left: 1.2rem;
      line-height: 1.8;
    }

    .lead {
      font-size: 1.1rem;
      color: #4b5563;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      color: #111827;
      text-decoration: none;
      font-weight: 600;
    }

    .links a:hover {
      border-color: #2563eb;
      color: #2563eb;
    }

    @media (max-width: 520px) {
      main {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>こんにちは</h1>
    <p class="lead">このページは、GitHub Pagesで公開している自己紹介サイトです。</p>

    <h2>About</h2>
    <p>
      はじめまして。ここには、自分のプロフィールや興味のあること、
      取り組んでいることを紹介していきます。
    </p>

    <h2>Interests</h2>
    <ul>
      <li>Web制作</li>
      <li>プログラミング</li>
      <li>新しい技術を学ぶこと</li>
    </ul>

    <div class="links" aria-label="関連リンク">
      <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </main>
</body>
</html>
